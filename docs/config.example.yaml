# Vertex API 密钥（用于 Vertex 兼容端点；base-url 可选）
# vertex-api-key:
#   - api-key: "vk-123..."                        # 通过 x-goog-api-key 请求头发送
#     weight: 5                                    # 可选：weighted-round-robin 的分配权重；省略时默认为 1，最大为 1,000,000
#     prefix: "test"                              # 可选：要求使用类似 "test/vertex-pro" 的名称才能命中该凭据
#     disable-cooling: false                       # 可选覆盖：true 禁用冷却，false 启用冷却；省略时继承全局设置
#     request-retry: 3                             # 可选的逐身份验证覆盖；0 禁用额外轮次，省略或小于 0 时继承全局设置
#     base-url: "https://example.com/api"         # 可选，例如 https://zenmux.ai/api；省略时回退到 Google Vertex
#     proxy-url: "socks5://proxy.example.com:1080" # 可选：覆盖该密钥使用的代理
#     # proxy-url: "direct" # 可选：明确让该凭据直接连接
#     headers:
#       X-Custom-Header: "custom-value"
