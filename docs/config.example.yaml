# 全局 OAuth 模型名称别名，按通道分别配置
# 这些别名同时影响模型列表中的模型 ID 和请求路由。
# 支持的通道：vertex、aistudio、antigravity、claude、codex、kimi、xai。
# 注意：别名不适用于 gemini-api-key、interactions-api-key、codex-api-key、xai-api-key、
# claude-api-key、openai-compatibility 或 vertex-api-key。
# 注意：由于别名会影响合并后的 /v1 模型列表与合并路由，不同提供商之间重叠的
# 客户端可见名称可能产生歧义。若需要严格固定后端，请使用唯一别名/前缀，或避免名称重叠。
# 可以为同一个上游 name 重复配置不同 alias，从而公开多个客户端模型名称。
# 每个条目的可选字段：
#   fork: true                  # 保留上游模型，同时把别名作为独立的客户端可见模型公开
#   display-name: "Model Name" # 覆盖模型目录中显示的人类可读名称
#   force-mapping: true         # 把上游响应中的模型字段改写回客户端可见别名；下方示例仅在 antigravity 中使用
# 每个认证记录的 OAuth 别名也可以保存在 OAuth 认证 JSON 的 "model_aliases" 字段中。
# 旧版 "model-aliases" 凭据仍受支持，并会在加载时规范化。
# 它们只作用于被选中的认证记录，并优先于相同客户端可见别名的全局设置。
# 认证 JSON 示例：
# {
#   "type": "codex",
#   "email": "user@example.com",
#   "model_aliases": [
#     {"name": "gpt-5.3-codex-spark", "alias": "gpt-5.5"},
#     {"name": "gpt-5.3-codex-spark", "alias": "gpt-5.4"}
#   ]
# }
# oauth-model-alias:
#   vertex:
#     - name: "gemini-2.5-pro"
#       alias: "g2.5p"
#   aistudio:
#     - name: "gemini-2.5-pro"
#       alias: "g2.5p"
#   antigravity:
#     - name: "gemini-pro-agent"                   # 上游 Antigravity 模型 ID
#       alias: "gemini-3.1-pro-preview"            # 客户端可见 ID（Gemini 3.1 Pro Preview）
#       display-name: "Antigravity Gemini 3.1 Pro" # 可选：模型目录中显示的名称
#       fork: true
#       force-mapping: true
#   claude:
#     - name: "claude-sonnet-4-5-20250929"
#       alias: "cs4.5"
#   codex:
#     - name: "gpt-5"
#       alias: "g5"
#   kimi:
#     - name: "kimi-k2.5"
#       alias: "k2.5"
#   xai:
#     - name: "grok-4.3"
#       alias: "grok-latest"
#   sample-provider:                  # OAuth 插件也支持使用插件 provider key
#     - name: "sample-model-latest"
#       alias: "sample-latest"

