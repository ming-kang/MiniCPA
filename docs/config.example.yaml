#     # 默认行为（省略或留空）：保留调用方请求的指纹与请求头。
#     # 官方 api.anthropic.com API 密钥默认不会额外添加 CLI beta/身份信息，
#     # 除非设置此字段；自定义网关和委托提供商同样如此。
#     #
#     # 此字段只控制 /v1/messages 及相关 Claude 执行路径的请求指纹。
#     # 认证方式仍然是 API 密钥：api.anthropic.com 使用 x-api-key，自定义 base-url 使用 Bearer。
#     # 它不会启用 OAuth 刷新、用户资料获取或 OAuth 取消语义。
#     #
#     # 可选值：
#     #   省略或留空       = 使用调用方控制的 API 密钥指纹（尊重调用方请求）
#     #   "claude-code-cli" = 使用与 Claude Code OAuth CLI 相同的 Messages 请求指纹，
#     #                       对官方 Anthropic API 密钥也包括 OAuth Anthropic-Beta 集合、
#     #                       api.anthropic.com 上的 CCH 签名，以及稳定的 CLI
#     #                       metadata.user_id、session_id 与设备身份。
#     #                       API 密钥根据密钥本身生成身份种子；
#     #                       委托 OAuth 提供商使用稳定的认证 ID，而不是轮换中的访问令牌。
#     #                       "oauth-cli" 是保留兼容性的旧别名。
#     #
#     # count_tokens 对所有来源都保持原生 model/messages/tools 结构，包括选择启用的 Kimi。
#     # 它不会发送 billing/CCH、currentDate、metadata 或诊断信息。
#     #
#     # CCH：计费区块可能携带逐请求生成的 cch 哈希。CPA 只在 Claude Code 实际使用的位置
#     # 精确发送该值，即第一方 api.anthropic.com 与 Vertex。对其他网关（包括 Kimi）选择启用时，
#     # 仍会发送计费区块，但不附带 cch，因此逐请求哈希不会破坏该网关的提示缓存。
#     # api.anthropic.com 会自行移除此区块（占用 0 token，不影响缓存）。Kimi 默认丢弃整个区块，
#     # 只有在明确启用指纹后才保留未签名版本。
#     # 真实 Claude OAuth 凭据在所有上游都会进行签名；指向 CPA 的下游 Claude Code
#     # 客户端本身无法生成该值。
#     #
#     # 示例（官方 Anthropic 或自定义 Messages 网关）：
#     #   - api-key: "your-key"
#     #     # base-url: "https://gateway.example"   # 使用 api.anthropic.com 时省略
#     #     fingerprint-profile: "claude-code-cli"
#     #     cloak:
#     #       mode: "always"   # 当上游拒绝非 CLI 客户端时建议使用
#     #
#     # 委托式 Anthropic Messages OAuth 文件（Kimi 等）在认证 JSON 中使用 "fingerprint_profile"。
#     # 刷新令牌时会保留该字段。示例：
#     #   {
#     #     "type": "kimi",
#     #     "access_token": "...",
#     #     "refresh_token": "...",
#     #     "fingerprint_profile": "claude-code-cli"
#     #   }
#     #   旧版 "fingerprint-profile" 凭据仍受支持，并会在加载时规范化。
#     # fingerprint-profile: "claude-code-cli" # 可选的 claude-api-key 提供商字段；默认留空并由调用方控制；取消注释即可启用
#     experimental-cch-signing: false # 已弃用的兼容字段；真实 Claude OAuth 会自动生成 CCH，
#                                     # claude-code-cli 配置仅在 api.anthropic.com 自动生成；
#                                     # Vertex 继续使用提供商原生签名

# Anthropic-Beta 会针对每个请求动态组装，而不是作为固定列表发送，其行为与
# Claude Code 2.1.220 一致：context-1m 紧跟在 claude-code 之后；mid-conversation-system
# 只会为接受 role=system 消息的模型添加；advanced-tool-use 只在请求声明工具时添加；
# server-side-fallback、fallback-credit 和 structured-outputs 排在 effort 之后。
# 直接请求 api.anthropic.com 时，调用方只能请求真实 Claude Code 也会发送的 beta，
# 而且这些 beta 会被放在观测到的对应位置；其他 beta 会被丢弃，以确保发出的集合
# 始终符合真实客户端可能产生的形态。其他 Anthropic 兼容上游仍会原样转发调用方的 beta。
#
# Claude API 请求的默认请求头。只有在测量新版 Claude Code 后才应更新。
# 未确认的客户端使用这套 CLI 基线。经过验证的原生 Claude Code CLI、sdk-cli 和 VSCode 请求，
# 只有在 Claude Code 版本、软件包版本和运行时版本都与这里配置的基线完全一致时，
# 才会保留实测的入口点和软件形态；未经测量的版本会回退到该基线。在旧版模式中，
# timeout 只作为兜底值，而经过验证的原生 OS/arch 仍由客户端提供。启用
# stabilize-device-profile 后，OS/arch 会固定为下列值，缓存的资料也会被限制在
# 同一套精确的软件基线上，而不会学习更新的客户端版本。
# claude-header-defaults:
#   user-agent: "claude-cli/2.1.220 (external, cli)"
#   package-version: "0.94.0"
#   runtime-version: "v26.3.0"
#   os: "MacOS"
#   arch: "arm64"
#   timeout: "600"
#   timezone: "Asia/Singapore"  # 用于伪装 currentDate 的兜底 IANA 时区；身份验证 JSON 中的 "timezone" 优先
#   stabilize-device-profile: false  # 可选，默认 false；设为 true 时启用逐身份验证/API key 的指纹固定

# Codex OAuth 模型请求的默认请求头。
# 这些设置仅用于文件型/OAuth Codex 请求，并且只在客户端未发送对应请求头时补充。
# `user-agent` 同时适用于 HTTP 和 WebSocket 请求；`beta-features` 只适用于 WebSocket 请求。
# 它们不作用于 codex-api-key 条目。
# codex-header-defaults:
#   user-agent: "codex_cli_rs/0.114.0 (Mac OS 14.2.0; x86_64) vscode/1.111.0"
#   beta-features: "multi_agent"

