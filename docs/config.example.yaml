# CLIProxyAPI 中文配置示例

# 服务监听的主机或网络接口。留空（""）时默认监听所有接口（IPv4 和 IPv6）。
# 使用 "127.0.0.1" 或 "localhost" 可将访问范围限制在本机。
host: "127.0.0.1"

# 服务端口
port: 8317

# HTTPS 的 TLS 设置。启用后，服务将使用所提供的证书和私钥进行监听。
tls:
  enable: false
  cert: ""
  key: ""

# 管理 API 设置
remote-management:
  # 是否允许来自非本机地址的远程管理访问。
  # 设为 false 时，只有本机能够访问管理端点，但仍然必须提供管理密钥。
  allow-remote: false

  # 管理密钥。此处填写明文时，程序会在启动时自动将其哈希。
  # 所有管理请求（包括来自本机的请求）都必须提供此密钥。
  # 留空将彻底禁用管理 API；所有 /v0/management 路由都会返回 404。
  secret-key: "CLIPROXYAPI"

  # 设为 true 时，禁止下载内置管理控制面板资源，并关闭对应的 HTTP 路由。
  disable-control-panel: false

  # 是否禁止管理面板从 GitHub 定期在后台自动更新
  # 启用后，如果面板资源不存在，首次访问时仍会下载；此后不再自动更新。
  disable-auto-update-panel: false

  # 管理控制面板的 GitHub 仓库。可填写仓库 URL 或 Releases API URL。
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

# 身份验证文件目录（支持使用 ~ 表示用户主目录）
auth-dir: "auths"

# 用于客户端身份验证的 API 密钥
api-keys:
  - "sk-cliproxyapi"

# 是否启用调试日志
debug: false

# 是否启用 pprof HTTP 调试服务（主机:端口）。为安全起见，应始终绑定到本机地址。
pprof:
  enable: false
  addr: "127.0.0.1:8316"

# 在 Home 模式下，凭据并发由 Home 统一配置。Home 合成的配置具有最终解释权，
# 包括下列值在内的本地设置都会被忽略。不要使用本地配置覆盖 Home 的并发策略。
# credential-concurrency:
#   lifecycle-config-revision: 1
#   observation-barrier-revision: 0
#   cpa-heartbeat-timeout: "3s"
#   cpa-cancel-bound: "5s"
#   reclaim-grace: "5s"
#   cleanup-interval: "5s"
#   release-flush-interval: 250ms
#   release-max-backoff: 2s
#   busy-retry-min: 250ms
#   busy-retry-max: 1s
#   max-limit: 1000000

# 凭据在途请求观测快照的约定。
# credential-in-flight:
#   snapshot-interval: 2s
#   stale-after: 10s
#   max-part-bytes: 262144
#   max-part-count: 64
#   max-revision-bytes: 16777216
#   max-aggregate-groups: 100000
#   max-details: 10000
#   max-string-bytes: 256
#   staging-retention: 1m

# 标准动态库插件属于受信任的进程内代码，默认禁用。
# 针对目标 GOOS/GOARCH，可使用 go build -buildmode=c-shared 编译 Go 示例。
# 其他语言也可以实现相同的 C ABI 和 JSON 方法协议。
# 插件执行器要求存在一个 provider key 相同的匹配身份验证记录。
# 如果同一个提供商同时配置为 OpenAI 兼容提供商，则原生执行器优先。
# 插件命令行参数和管理 API 路由都属于可选能力。
# 现有原生命令行参数、路由，以及优先级更高的插件参数或路由均不能被替换。
# 插件列表管理 API 会从插件元数据中读取 Logo 和 ConfigFields，用于管理界面展示。
# 单个插件的 enabled 只控制 plugins.configs.<pluginID>.enabled，不会隐式修改全局 plugins.enabled。
plugins:
  enabled: false
  dir: "plugins"
  # 额外的插件商店注册表；内置的官方注册表始终会包含在内。
  # store-sources:
  #   - "https://example.com/cliproxy-plugins/registry.json"
  # 可选的插件商店身份验证规则。对应值从环境变量中读取；
  # 令牌不会写入插件清单或节点状态。
  # store-auth:
  #   - match: "https://example.com/cliproxy-plugins/"
  #     apply-to: ["registry", "artifact"]
  #     type: bearer
  #     token-env: "CLIPROXY_PLUGIN_STORE_TOKEN"
  configs:
    example:
      enabled: true
      priority: 1
      config1: true
      config2: "string"
      config3: 3
      mode: "safe" # 枚举值示例：safe、fast

# 设为 true 时，关闭开销较高的请求日志和 HTTP 中间件功能，以降低高并发下每个请求的内存占用。
commercial-mode: false

# 设为 true 时，将应用日志写入自动轮转的文件，而不是输出到 stdout。
logging-to-file: true

# logs 目录中全部日志文件允许占用的最大总空间（MB）。超过上限后，程序会从最旧的日志开始删除，
# 直至总大小回到限制以内。设为 0 表示不启用总容量限制。
logs-max-total-size-mb: 32

# 关闭请求日志时，最多保留的错误日志文件数量。
# 超出后会删除最旧的错误日志。默认值为 10；设为 0 表示不自动清理。
error-logs-max-files: 10

# 设为 false 时，关闭内存中的用量统计聚合。
usage-statistics-enabled: true

# 管理 API 的用量队列项目在内存中保留的时长（秒）。
# 本地 Redis RESP 用量输出已禁用。
# 默认值：60；最大值：3600。
redis-usage-queue-retention-seconds: 60

# 全局代理 URL。支持 socks5、http 和 https 协议。示例：socks5://user:pass@192.168.1.1:1080/
# 单条凭据中的 proxy-url 还可填写 "direct" 或 "none"，以显式绕过全局代理和环境变量代理。
proxy-url: "socks5://127.0.0.1:7890"

# 设为 true 时，不带前缀的模型请求只会使用同样未设置前缀的凭据；prefix 与模型名相同时除外。
force-model-prefix: false

# 设为 true 时，将经过筛选的上游响应头转发给下游客户端。
# 默认值为 false，即不转发。
passthrough-headers: false

# 第一轮已耗尽所有符合条件的凭据后，额外执行的凭据重试轮数。
# 第 0 轮为初始轮；第 r 轮只允许有效 request-retry 不小于 r 的凭据参与。
# 凭据或提供商层级显式设置的非负值优先；省略或设为负数时继承此全局值，
# 显式设为 0 时只参与第 0 轮。新版 CPA 节点会在初始轮发送 retry_round=0，
# 后续轮次逐次递增；旧版分发方法不发送该字段，并继续沿用旧语义。
# 额外轮次适用于 HTTP 403、408、429、500、502、503 和 504 错误。
# 单条凭据或提供商的覆盖值优先；0 表示禁用额外轮次，省略或设为负数则继承此全局设置。
request-retry: 3

# 每一轮凭据重试在完成逐凭据轮次筛选后，最多尝试多少个不同凭据。
# 设为 0 表示尝试全部可用凭据。因该上限而跳过的凭据仍会随全局轮次推进，
# 因此该上限并不能保证每个凭据拥有固定的实际重试次数。
max-retry-credentials: 0

# 两轮重试之间等待凭据冷却的最长时间（秒）。
# 设为 0 或负数表示永不等待凭据冷却。
# 无需等待的重试轮次仍由 request-retry 控制。
max-retry-interval: 30

# 设为 true 时，在全局范围内关闭身份验证或模型的冷却调度，以避免失败状态造成不可用时间窗。
# 如果某条凭据或提供商设置了 disable-cooling，则该局部值优先于全局值。
disable-cooling: false

# 设为 true 时，在身份验证文件旁以 .cds 文件持久化每条凭据的冷却状态。
# 默认值为 false；关闭时，冷却状态只保存在内存中。
save-cooldown-status: false

# 上游临时错误（408/500/502/503/504）的冷却时长（秒）。
# 设为 0 时沿用旧版的 60 秒冷却；设为 -1 时禁用临时错误冷却。
transient-error-cooldown-seconds: 0

# 设为 true 时，在全局范围内关闭 Claude 请求伪装，包括 Claude Code CLI 身份伪装和
# 系统提示词替换；此时原始系统提示词会原样传递给 Claude。
# 单条凭据仍可覆盖此行为：claude-api-key 条目使用 "cloak.mode"，
# Claude OAuth/令牌文件使用 "cloak_mode"。默认 false 保留按客户端自动判断的
# "auto" 行为，即只对非 Claude Code 客户端启用伪装。
disable-claude-cloak-mode: false

# Claude Code 兼容性设置。
claude-code:
  # 设为 true 时，Anthropic 模型列表响应会返回原始模型 ID，而不是伪装后的 ID。
  disable-cloaking-model-list: true

# disable-image-generation 支持以下取值：false（默认）、true、"chat" 或 "passthrough"。
# - true：在所有位置禁用 image_generation；/v1/images/generations 和 /v1/images/edits 也会返回 404。
# - "chat"：禁止在非图片端点中注入 image_generation，但保留 /v1/images/generations 和 /v1/images/edits。
# - "passthrough"：在非图片端点中既不注入也不移除 image_generation，原样转发客户端请求体；在 /v1/images/* 端点上的行为与 "chat" 相同。
disable-image-generation: false

# 当 Codex 图片请求未直接通过 Image API 代理时，旧版托管 image_generation 工具路径所使用的基础模型。
# 模型名必须以 "gpt-" 开头（不区分大小写）。未设置或取值无效时，默认使用 "gpt-5.4-mini"。
# gpt-image-2-base-model: "gpt-5.4-mini"

# /openai/v1/videos 和 xAI 视频创建接口返回的视频 ID，与创建该视频的凭据保持绑定的时长。
# 默认值：3h。
video-result-auth-cache-ttl: "3h"

# 核心身份验证自动刷新工作池大小，用于 OAuth 或文件型凭据的令牌刷新。
# 大于 0 时会覆盖默认工作线程数 16。
# auth-auto-refresh-workers: 16

# 配额耗尽时的处理方式
quota-exceeded:
  switch-project: true # 配额耗尽时是否自动切换到另一个项目
  switch-preview-model: false # 配额耗尽时是否自动切换到预览模型
  antigravity-credits: true # Claude 模型的所有免费层凭据均耗尽时，是否将积分作为最后的兜底方案

# 多个凭据同时匹配时的选择策略。
routing:
  strategy: "round-robin" # 可选：round-robin（默认）、weighted-round-robin、fill-first
  # weighted-round-robin 使用每条凭据的整数权重；默认值为 1，最大值为 1,000,000。
  # 使用该策略时，权重小于或等于 0 的凭据不会参与选择。
  # 对于 OAuth 或文件型凭据，可在身份验证 JSON 顶层加入数值类型的 "weight" 字段。
  # 为所有客户端启用通用的会话粘性路由。
  # 优先识别 Claude Code、Codex、OpenCode 和 pi 的显式会话请求头，
  # 其次依次使用 prompt_cache_key、Responses 会话 ID、旧版请求体 ID、
  # 执行身份或推导出的会话身份，最后回退到现有的首条消息哈希。
  # 绑定的身份验证不可用时，始终会自动故障转移。
  # 已建立的绑定优先级高于凭据优先级：会话绑定后，即使更高优先级的凭据恢复，
  # 仍会继续使用当前凭据。凭据优先级只决定首次绑定、无会话请求，以及故障转移后的重新绑定。
  session-affinity: false # 默认值：false
  # 会话到身份验证凭据的绑定保留时长。默认值：1h
  session-affinity-ttl: "1h"

# Codex 提供商行为设置。
codex:
  # 设为 true 且 routing.strategy 为 fill-first，或 routing.session-affinity 为 true 时，
  # 会针对选中的身份验证凭据重新映射 Codex 的 prompt_cache_key 和安装身份。
  # 某些用户担心请求跟踪标识符可能被用作违反服务条款并导致封禁的依据；
  # 此选项仅用于满足这类顾虑，并不代表该担忧已被证实。
  identity-confuse: false
  # 是否关闭在 HTTP/SSE 和 WebSocket 请求中强制使用官方 Codex User-Agent 与 Originator 请求头。
  disable-codex-cloaking: false
  # 在上游发出第一个生成事件之前，暂缓向下游发送初始握手事件
  #（response.created、response.in_progress 以及 WebSocket 元数据帧）。
  # 原因：上游可能在 HTTP 200 流内部、紧接握手事件之后返回 `server_is_overloaded`，
  # 而不是在传输层直接返回 503。缓存握手事件可延迟提交下游响应头，
  # 从而有机会透明地改用另一条凭据重试。只有过载或限流拒绝会触发故障转移；
  # 其他终止性错误仍会像以前一样原样在流中传递。
  # 代价：响应头会延迟到开始生成时才发送；长时间推理请求可能因此触发客户端或
  # 反向代理的读取超时，例如 nginx 的 proxy_read_timeout。
  # 默认值：false
  stream-bootstrap-buffering: false
  # 设为 true 时，针对多智能体 v2 优化 Codex Desktop、codex-tui 和 codex_cli_rs 请求。
  # 此功能会刷新 Codex 的 spawn_agent 模型信息、移除 message 参数加密、
  # 规范化 Codex 使用的加密 agent_message 内容，并在非 Codex 上游协议中
  # 将 agent_message 输入转换为标准的用户消息。
  optimize-multi-agent-v2: false
  # 在当前进程内终止并中继 Codex Live 的 WebRTC 音频和 DataChannel 流量。
  # 该功能要求入站 UDP 可达；保持关闭可继续使用媒体直连行为。
  live-media-relay:
    enabled: false
    # 最大并发媒体会话数。设为 0 时使用默认值 32。
    max-sessions: 32
    # 是否拒绝目标为私有、回环、链路本地或未指定 IP 的下游 SDP 候选地址。
    # 对本机或受信任网络中的 Codex Desktop 连接，应保持为 false。
    disable-private-remote-ips: false
    # CPA 位于 1:1 NAT 后方时，对外通告的公网 IPv4 或 IPv6 地址。
    public-ip: ""
    # 可选的 UDP 分配端口范围。上下限必须同时设置，并且每个会话至少需要两个端口。
    udp-port-min: 0
    udp-port-max: 0
    # 可选的 STUN/TURN 服务器。JSON 配置 API 永远不会返回 TURN 凭据。
    # 如果全局或单条身份验证均未设置具体 proxy-url，WebRTC 将使用常规的 ICE/STUN/TURN 直连。
    # 如果 proxy-url 使用 http、https、socks5 或 socks5h，面向 OpenAI 的一侧会被强制通过
    # 该代理建立带身份验证的 ICE-TCP 连接，并且不会回退到 UDP 或直连。
    # 面向 Codex Desktop 的一侧仍保持直连，已配置的 ICE 服务器也仍然适用于这一侧。
    # ice-servers:
    #   - urls:
    #       - "stun:stun.example.com:3478"
    #   - urls:
    #       - "turn:turn.example.com:3478?transport=udp"
    #     username: "user"
    #     credential: "secret"

# Antigravity 提供商行为设置。
# antigravity:
#   sensitive-words:             # 可选：在系统指令中用零宽字符混淆的词语
#     - "API"
#     - "proxy"

# xAI 提供商行为设置。
xai:
  # 设为 true 时，如果请求中未声明原生 x_search 工具，则自动注入该工具。
  # 适用时，注入的工具也会加入 tool_choice.allowed_tools。
  inject-x-search: false

# 设为 true 时，为 WebSocket API（/v1/ws）启用身份验证。
ws-auth: true

# 大于 0 时，非流式响应每隔 N 秒发送一个空行，以防止空闲超时。
nonstream-keepalive-interval: 0
# 流式响应行为，包括 SSE 保活和安全的启动阶段重试。
# streaming:
#   keepalive-seconds: 15   # 默认值：0（禁用）；小于或等于 0 时不发送保活。
#   bootstrap-retries: 1    # 默认值：0（禁用）；在发送第一个字节之前允许的重试次数。

# 对思考块（Antigravity/Claude）进行签名缓存校验。
# 设为 true（默认）时，优先使用并验证缓存的签名。
# 设为 false 时，客户端签名经过规范化后直接使用；这是供测试使用的旁路模式。
# antigravity-signature-cache-enabled: true

# 旁路模式下的签名验证严格程度；仅在关闭签名缓存时生效。
# 设为 true 时，验证完整的 Claude protobuf 树结构（字段 2 -> 字段 1）。
# 设为 false（默认）时，只检查 R/E 前缀、Base64 格式以及首字节是否为 0x12。
# antigravity-signature-bypass-strict: false


# Gemini API 密钥
# gemini-api-key:
#   - api-key: "AIzaSy...01"
#     weight: 5 # 可选：weighted-round-robin 的流量权重；省略时默认为 1，最大值为 1,000,000
#     prefix: "test" # 可选：要求使用类似 "test/gemini-3-pro-preview" 的模型名才能命中此凭据
#     disable-cooling: false # 可选覆盖：true 禁用冷却，false 启用冷却；省略则继承全局设置
#     request-retry: 3 # 可选的单认证覆盖值；0 禁用额外轮次；省略或设为负数则继承全局设置
#     request-scoped-errors: # 可选：按 HTTP 状态码和响应正文模式自定义上游错误分类规则
#       - status: 400        # 要匹配的 HTTP 状态码
#         match:             # 可选：字符串包含匹配
#           - "maximum_context_length"
#           - "context_length_exceeded"
#         match-regexr:      # 可选：正则表达式匹配
#           - "maximum_context_length$"
