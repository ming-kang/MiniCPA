#         action: "stop"     # "stop"：返回错误且不冷却；"stop-and-cooldown"：返回错误并冷却；
#                            # "continue"：尝试下一凭据且不冷却；"continue-and-cooldown"：尝试下一凭据并冷却
#     base-url: "https://generativelanguage.googleapis.com"
