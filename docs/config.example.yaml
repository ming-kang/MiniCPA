#       X-Custom-Header: "custom-value"
#       # 以 "$" 开头的值会动态复制下游客户端请求中对应请求头的值。
#       # 若客户端未发送指定请求头，则省略该请求头。
#       # X-Claude-Code-Session-Id: "$ABC" # 复制客户端的 "ABC" 请求头
#     proxy-url: "socks5://proxy.example.com:1080"
#     # proxy-url: "direct" # 可选：为此凭据明确使用直连
#     models:
#       - name: "gemini-2.5-flash" # 上游模型名称
#         alias: "gemini-flash"    # 映射到该上游模型的客户端别名
#         display-name: "Gemini Flash" # 可选：模型目录中显示的名称
#         max-context-length: 1048576 # 可选：覆盖 Codex 客户端的上下文窗口元数据
#         is-compat: false             # 可选：为兼容上游保留签名为空的思考块
#         thinking:                    # 可选：精确声明此模型支持的思考级别
#           levels: ["high", "medium", "low", "none", "auto"]
#     excluded-models:
#       - "gemini-2.5-pro"     # 从此提供商排除指定模型（精确匹配）
#       - "gemini-2.5-*"       # 前缀通配匹配，例如 gemini-2.5-flash、gemini-2.5-pro
