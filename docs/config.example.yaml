#     # OAuth 与 API 密钥使用不同的指纹约定。
#     #   - 真实 Claude OAuth 始终使用严格的 Claude Code CLI 线上请求指纹。
#     #   - API 密钥（官方 Anthropic、自定义网关、Kimi）默认保持宽松，
#     #     并由调用方控制；仅在设置此字段后才改变。
