name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to publish (for example, 0.1.4)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @astralyn/minicpa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Verify release request
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const version = process.env.RELEASE_VERSION;
          if (process.env.GITHUB_REF !== "refs/heads/main") {
            throw new Error("Releases must run from main.");
          }
          if (!version || !/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error(`Expected a stable version, got ${version ?? "nothing"}.`);
          }

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          if (
            packageJson.version !== version ||
            packageLock.version !== version ||
            packageLock.packages?.[""]?.version !== version
          ) {
            throw new Error("The workflow input, package.json, and package-lock.json must match.");
          }

          const changelog = readFileSync("CHANGELOG.md", "utf8");
          if (!changelog.includes(`## [${version}] - `)) {
            throw new Error(`CHANGELOG.md has no release heading for ${version}.`);
          }
          NODE

      - name: Install npm
        run: npm install --global npm@11.15.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify source
        run: |
          npm run audit:prod
          npm run lint
          npm test
          npm run build

      - name: Pack package
        id: pack
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          package_dir="$RUNNER_TEMP/minicpa-package"
          mkdir "$package_dir"
          npm pack --ignore-scripts --silent --pack-destination "$package_dir" >/dev/null
          tarball="$package_dir/astralyn-minicpa-$RELEASE_VERSION.tgz"
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify package installation
        env:
          PACKED_TARBALL: ${{ steps.pack.outputs.tarball }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: npm run verify:package-install -- "$PACKED_TARBALL" "$RELEASE_VERSION"

      - name: Publish package
        env:
          PACKED_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "$PACKED_TARBALL" --access public --provenance --registry=https://registry.npmjs.org
